
name: Build Mobile Zarza APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm install

      - name: Prepare app files
        run: |
          mkdir -p www
          cp index.html app.js style.css manifest.webmanifest sw.js icon-512.png www/

      - name: Build print bridge
        run: npx --yes esbuild print-bridge.js --bundle --platform=browser --format=iife --outfile=www/print-bridge.bundle.js

      - name: Build backup bridge
        run: npx --yes esbuild backup-bridge.js --bundle --platform=browser --format=iife --outfile=www/backup-bridge.bundle.js

      - name: Add Android platform
        run: npx cap add android

      - name: Add native SaveFile plugin
        run: |
          mkdir -p android/app/src/main/java/ir/mobilezarza/app

          cp SaveFilePlugin.java android/app/src/main/java/ir/mobilezarza/app/SaveFilePlugin.java

          cat > android/app/src/main/java/ir/mobilezarza/app/MainActivity.java <<'EOF'
          package ir.mobilezarza.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(SaveFilePlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

      - name: Generate Android app icons
        run: |
          mkdir -p assets
          cp icon-512.png assets/logo.png
          npm install --no-save @capacitor/assets
          npx @capacitor/assets generate --android

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-zarza-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
